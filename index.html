<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <style>
        body {
            font-family: Roboto, helvetica, arial, sans-serif;
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        /* Кнопка для получения жеста пользователя */
        #start-button {
            padding: 15px 40px;
            font-size: 18px;
            color: #fff;
            background-color: #1a73e8;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: background-color 0.2s;
            z-index: 10;
        }
        #start-button:hover {
            background-color: #1557b0;
        }
        #screamer-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 99999;
        }
        #screamer-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- Стартовая кнопка, обязательная для снятия блокировок браузера -->
    <button id="start-button" onclick="initiateScreamer()">Войти</button>

    <div id="screamer-container">
        <img src="7f3UOH.gif" alt="">
    </div>

    <audio id="screamer-sound" src="caughtyou.mp3" loop preload="auto"></audio>

    <script>
        var isScreamerActive = false;

        function initiateScreamer() {
            // Скрываем кнопку входа
            document.getElementById('start-button').style.display = 'none';
            
            // Запускаем основной скрипт в контексте клика
            activateScreamer();
        }

        function activateScreamer() {
            isScreamerActive = true;
            var container = document.getElementById('screamer-container');
            var sound = document.getElementById('screamer-sound');
            
            container.style.display = 'block';

            // Воспроизведение звука теперь разрешено, так как функция вызвана через onclick
            sound.play().catch(function(error) {
                console.log("Ошибка воспроизведения звука:", error);
            });

            // Запрос полноэкранного режима теперь легитимен
            if (container.requestFullscreen) {
                container.requestFullscreen().catch(function(err) {
                    console.log("Ошибка перехода в полноэкранный режим:", err);
                });
            } else if (container.webkitRequestFullscreen) { 
                container.webkitRequestFullscreen();
            }

            window.addEventListener('beforeunload', preventExit);
        }
      
        function preventExit(e) {
            if (!isScreamerActive) return;
            e.preventDefault();
            e.returnValue = 'Изменения не сохранены.';
            return e.returnValue;
        }

        window.addEventListener('keydown', function(e) {
            if (isScreamerActive && (e.key === 'Escape' || e.keyCode === 27)) {
                preventExit(e);
                alert("Изменения не сохранены! Вы уверены, что хотите прервать проверку?");
            }
        });
        
        document.addEventListener('click', function() {
            if (isScreamerActive) {
                var container = document.getElementById('screamer-container');
                var sound = document.getElementById('screamer-sound');
                
                sound.play();

                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    if (container.requestFullscreen) container.requestFullscreen();
                    else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
                }
            }
        });
    </script>
</body>
</html>
