<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <style>
        body {
            font-family: Roboto, helvetica, arial, sans-serif;
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #start-button {
            padding: 15px 40px;
            font-size: 18px;
            color: #fff;
            background-color: #1a73e8;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 10;
        }
        #screamer-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 99999;
            /* Прячем курсор мыши, чтобы усложнить закрытие крестиком */
            cursor: none; 
        }
        #screamer-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <button id="start-button" onclick="initiateScreamer()">Войти</button>

    <div id="screamer-container">
        <img src="7f3UOH.gif" alt="">
    </div>

    <!-- Добавлен атрибут autoplay для подстраховки и принудительный запуск звука на максимум -->
    <audio id="screamer-sound" src="caughtyou.mp3" loop preload="auto" volume="1.0"></audio>

    <script>
        var isScreamerActive = false;

        function initiateScreamer() {
            document.getElementById('start-button').style.display = 'none';
            activateScreamer();
        }

        function activateScreamer() {
            isScreamerActive = true;
            var container = document.getElementById('screamer-container');
            var sound = document.getElementById('screamer-sound');
            
            container.style.display = 'block';

            // Принудительно выставляем громкость на максимум
            sound.volume = 1.0;
            
            // Запуск аудио с детальным логированием ошибок в консоль
            sound.play().catch(function(error) {
                console.error("Критическая ошибка аудио: ", error.message);
                alert("Браузер заблокировал звук. Кликните еще раз по экрану!");
            });

            // Полноэкранный режим
            if (container.requestFullscreen) {
                container.requestFullscreen().catch(function(err) {
                    console.log("Фуллскрин заблокирован: ", err.message);
                });
            } else if (container.webkitRequestFullscreen) { 
                container.webkitRequestFullscreen();
            }

            // Защита от закрытия вкладки (вызовет стандартное системное окно)
            window.addEventListener('beforeunload', preventExit);
        }
      
        function preventExit(e) {
            if (!isScreamerActive) return;
            e.preventDefault();
            // Современный стандарт требует присвоения пустой строки или true, текст браузер подставит сам
            e.returnValue = ''; 
            return '';
        }

        // Блокировка клавиши Escape для предотвращения выхода из фуллскрина
        window.addEventListener('keydown', function(e) {
            if (isScreamerActive && (e.key === 'Escape' || e.keyCode === 27)) {
                e.preventDefault();
                // Имитация окна предупреждения
                alert("Ошибка системы! Завершите проверку.");
            }
        });
        
        // Любой повторный клик возвращает фуллскрин и запускает звук
        document.addEventListener('click', function() {
            if (isScreamerActive) {
                var container = document.getElementById('screamer-container');
                var sound = document.getElementById('screamer-sound');
                
                sound.play();

                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    if (container.requestFullscreen) container.requestFullscreen();
                }
            }
        });
    </script>
</body>
</html>
