<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>попался</title>
    <style>
        body {
            font-family: Roboto, helvetica, arial, sans-serif;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #screamer-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 99999;
        }
        #screamer-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div id="screamer-container">
        <img src="7f3UOH.gif" alt="">
    </div>

    <audio id="screamer-sound" src="caughtyou.mp3" loop preload="auto"></audio>

    <script>
        var isScreamerActive = false;

        // Запуск сразу после загрузки страницы
        window.addEventListener('DOMContentLoaded', function() {
            activateScreamer();
        });

        function activateScreamer() {
            isScreamerActive = true;
            var container = document.getElementById('screamer-container');
            var sound = document.getElementById('screamer-sound');
            
            container.style.display = 'block';

            // Попытка воспроизведения звука
            sound.play().catch(function(error) {
                console.log("Автовоспроизведение звука заблокировано браузером до первого клика по экрану.");
            });

            // Попытка перехода в полноэкранный режим
            if (container.requestFullscreen) {
                container.requestFullscreen().catch(function(err) {
                    console.log("Полноэкранный режим заблокирован до клика.");
                });
            } else if (container.webkitRequestFullscreen) { 
                container.webkitRequestFullscreen();
            }

            window.addEventListener('beforeunload', preventExit);
        }
      
        function preventExit(e) {
            if (!isScreamerActive) return;
            e.preventDefault();
            e.returnValue = 'Изменения не сохранены.';
            return e.returnValue;
        }

        window.addEventListener('keydown', function(e) {
            if (isScreamerActive && (e.key === 'Escape' || e.keyCode === 27)) {
                preventExit(e);
                alert("Изменения не сохранены! Вы уверены, что хотите прервать проверку?");
            }
        });
        
        document.addEventListener('click', function() {
            if (isScreamerActive) {
                var container = document.getElementById('screamer-container');
                var sound = document.getElementById('screamer-sound');
                
                // Включаем звук, если он был заблокирован политикой браузера
                sound.play();

                // Принудительно разворачиваем на весь экран при любом клике
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    if (container.requestFullscreen) container.requestFullscreen();
                    else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
                }
            }
        });
    </script>
</body>
</html>
